<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test de Casque & Microphone avec Enregistrement</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        h1 { color: #2c3e50; margin-bottom: 20px; }
        p { color: #555; font-size: 14px; line-height: 1.5; }
        button {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
            margin: 10px 5px;
            font-weight: bold;
        }
        button:hover { background-color: #27ae60; }
        button:disabled { background-color: #bdc3c7; cursor: not-allowed; }
        #stopBtn { background-color: #e74c3c; }
        #stopBtn:hover { background-color: #c0392b; }
        canvas {
            width: 100%;
            height: 120px;
            background-color: #2c3e50;
            border-radius: 8px;
            margin-top: 20px;
        }
        .status { font-weight: bold; margin: 15px 0; color: #7f8c8d; }
        .audio-player-container {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 2px dashed #eceff1;
        }
        audio { width: 100%; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Test Micro & Enregistrement</h1>
    <p>Cliquez sur <strong>Enregistrer</strong>, parlez dans votre micro (la jauge va s'animer), puis cliquez sur <strong>Arrêter</strong> pour réécouter votre voix dans votre casque.</p>
    
    <div>
        <button id="startBtn">Enregistrer</button>
        <button id="stopBtn" disabled>Arrêter</button>
    </div>

    <div class="status" id="statusText">Statut : Prêt</div>
    <canvas id="visualizer"></canvas>

    <div class="audio-player-container" id="playerContainer" style="display: none;">
        <strong>🎙️ Votre Enregistrement :</strong><br>
        <audio id="audioPlayer" controls></audio>
    </div>
</div>

<script>
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const statusText = document.getElementById('statusText');
    const canvas = document.getElementById('visualizer');
    const canvasCtx = canvas.getContext('2d');
    const playerContainer = document.getElementById('playerContainer');
    const audioPlayer = document.getElementById('audioPlayer');

    let audioCtx;
    let analyser;
    let stream;
    let source;
    let animationId;
    let mediaRecorder;
    let audioChunks = [];

    startBtn.addEventListener('click', async () => {
        audioChunks = []; // Réinitialiser l'enregistrement précédent
        playerContainer.style.display = 'none';

        try {
            // 1. Demander l'accès au micro
            stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
            
            statusText.textContent = "🔴 Enregistrement en cours... Parlez maintenant.";
            statusText.style.color = "#e74c3c";
            startBtn.disabled = true;
            stopBtn.disabled = false;

            // 2. Configurer la capture pour l'enregistrement (MediaRecorder)
            mediaRecorder = new MediaRecorder(stream);
            mediaRecorder.ondataavailable = event => {
                audioChunks.push(event.data);
            };

            mediaRecorder.onstop = () => {
                // Créer le fichier audio à partir des morceaux enregistrés
                const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                const audioUrl = URL.createObjectURL(audioBlob);
                audioPlayer.src = audioUrl;
                playerContainer.style.display = 'block'; // Afficher le lecteur audio
            };

            // 3. Configurer l'API Web Audio pour le visuel graphique uniquement
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 256;

            source = audioCtx.createMediaStreamSource(stream);
            source.connect(analyser);
            // Note : On ne connecte pas l'analyser à audioCtx.destination pour éviter le Larsen !

            // 4. Démarrer l'enregistrement et l'animation
            mediaRecorder.start();
            visualize();

        } catch (err) {
            console.error("Erreur :", err);
            statusText.textContent = "Erreur : Impossible d'accéder au micro.";
            statusText.style.color = "#e74c3c";
        }
    });

    stopBtn.addEventListener('click', () => {
        // Arrêter l'enregistrement MediaRecorder
        if (mediaRecorder && mediaRecorder.state !== "inactive") {
            mediaRecorder.stop();
        }

        // Arrêter les capteurs du micro
        if (stream) {
            stream.getTracks().forEach(track => track.stop());
        }

        // Fermer le contexte audio et le visuel
        if (audioCtx) { audioCtx.close(); }
        cancelAnimationFrame(animationId);
        
        // Réinitialiser le style de l'interface
        canvasCtx.clearRect(0, 0, canvas.width, canvas.height);
        statusText.textContent = "Statut : Enregistrement terminé. Écoutez le résultat ci-dessous.";
        statusText.style.color = "#2ecc71";
        startBtn.disabled = false;
        stopBtn.disabled = true;
    });

    function visualize() {
        const bufferLength = analyser.frequencyBinCount;
        const dataArray = new Uint8Array(bufferLength);

        function draw() {
            animationId = requestAnimationFrame(draw);
            analyser.getByteFrequencyData(dataArray);

            canvasCtx.fillStyle = '#2c3e50';
            canvasCtx.fillRect(0, 0, canvas.width, canvas.height);

            const barWidth = (canvas.width / bufferLength) * 2.5;
            let barHeight;
            let x = 0;

            for(let i = 0; i < bufferLength; i++) {
                barHeight = dataArray[i] / 1.5;
                canvasCtx.fillStyle = `rgb(${barHeight + 100}, 46, 214)`;
                canvasCtx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);
                x += barWidth + 1;
            }
        }
        draw();
    }
</script>

</body>
</html>
